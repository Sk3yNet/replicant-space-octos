name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # Actions › build › Run workflow: makes the tag and the release from main (e.g. v1.1.0)
    inputs:
      version:
        description: "Release tag, e.g. v1.1.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ReplicantSpace
          path: dist/ReplicantSpace.zip
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ReplicantSpace.zip
      - name: Refuse an existing tag (never overwrite a release)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists: pick a new version"; exit 1
          fi
      - name: Make the release (run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: dist/ReplicantSpace.zip
